# IMS Atlas variable catalog (SPEC §4).
# Ported entries are transformed from pinned imsfe/ims-backtest config/variables.yaml (do not retype by hand).
# New SPEC §4 variables are status: draft. Licence UNKNOWN => redistributable false / BYOD.
# Licence / terms live in catalog/sources.yaml; variables reference source_ids (SPEC §10.1).
# coverage_countries is filled by ETL later.
factors:
- demand
- cost_access
- logistics
- competition
- product_fit
- macro_risk
- institutional
- openness
- communication
- entrepreneurship
- sustainability
