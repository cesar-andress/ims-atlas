[project]
name = "imsatlas-etl"
version = "0.1.0"
description = "ETL and data release builder for IMS Atlas"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "César Andrés", email = "cesar.andres@unir.net" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Populated by `make pin-backtest` once config/ims-backtest.json has a real tag.
# Never pin to a branch.
backtest = [
  "imsfe @ git+https://github.com/cesar-andress/ims-backtest.git@v0.2.0",
]

[project.scripts]
atlas-etl = "imsatlas_etl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imsatlas_etl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
