name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync CNAME if domain configured
        continue-on-error: true
        run: make cname

      - name: Choose Vite base
        id: base
        run: |
          if [ -f app/public/CNAME ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/ims-atlas/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: |
          pnpm --filter @ims-atlas/core build
          pnpm --filter @ims-atlas/app build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      # First-time enable: site must exist with build_type=workflow or deploy-pages 404s.
      # Local PATs often lack Administration; GITHUB_TOKEN with pages:write may create it.
      - name: Ensure Pages site (Actions source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages site already configured"
            exit 0
          fi
          echo "Creating Pages site with build_type=workflow"
          if gh api --method POST "repos/${{ github.repository }}/pages" \
            -f build_type=workflow; then
            echo "Pages site created"
            exit 0
          fi
          echo "::error::GitHub Pages is not enabled and GITHUB_TOKEN cannot create it."
          echo "Enable once in the UI: Settings → Pages → Build and deployment → Source: GitHub Actions"
          echo "https://github.com/${{ github.repository }}/settings/pages"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
