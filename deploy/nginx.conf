server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;
    gzip_vary on;
    # Prefer precompressed .gz from the Vite build when present.
    gzip_static on;

    # Status JSON: short TTL
    location /status/ {
        alias /var/atlas/status/;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    # SPEC §3 / Phase 4: app reads /data/vX.Y.Z/...
    location /data/ {
        alias /var/atlas/data/release/public/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # Back-compat path used in Phase 2b docs
    location /data/release/ {
        alias /var/atlas/data/release/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # Hashed Vite assets: long-lived immutable cache (^~ beats regex below)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Demo / meta JSON (content-hashed less often): short cache + revalidate
    location /meta/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # SPA: React Router permalinks (HTML must revalidate)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
}
