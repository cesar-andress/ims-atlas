server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/geo+json
        image/svg+xml
        application/wasm;
    gzip_vary on;
    gzip_static on;

    # SPA shells for /status (JSON lives under /status/*.json only).
    location = /status {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /status/ {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Status JSON: host ETL tree first, then Vite build copy.
    location ~ ^/status/.+\.json$ {
        root /var/atlas;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri @status_dist;
    }
    location @status_dist {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    # Versioned release files: Vite public mirror first, then host release tree.
    location ~ ^/data/v[0-9] {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @data_host;
    }
    location @data_host {
        rewrite ^/data/(v.*)$ /$1 break;
        root /var/atlas/data/release/public;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # CURRENT pointer from SPA mirror (export-transparency writes app/public/data/CURRENT).
    location = /data/CURRENT {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "public, max-age=60" always;
        try_files /data/CURRENT =404;
    }

    location /data/release/ {
        alias /var/atlas/data/release/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # Team cerrada Parquet store (auth at Caddy edge — nginx does not authenticate).
    location /datos-cerrados/ {
        alias /var/atlas/data/store/cerrada/;
        default_type application/octet-stream;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        autoindex off;
        try_files $uri =404;
    }

    # Hot static files: keep descriptors in memory for faster serves.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;
        try_files $uri =404;
    }

    # Demo / fixture JSON: never long-cache (Phase 12-fix stale-panel bug).
    location /meta/ {
        etag on;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /geo/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        types { application/geo+json geojson; }
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
}
