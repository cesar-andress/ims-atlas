server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Status JSON: short TTL
    location /status/ {
        alias /var/atlas/status/;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        try_files $uri =404;
    }

    # SPEC §3 / Phase 4: app reads /data/vX.Y.Z/...
    location /data/ {
        alias /var/atlas/data/release/public/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # Back-compat path used in Phase 2b docs
    location /data/release/ {
        alias /var/atlas/data/release/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # SPA: React Router permalinks
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
