# Local Caddy + Authelia + nginx for /datos-cerrados Playwright checks.
# TEST ONLY credentials — see deploy/access/e2e-test-credentials.env.example
services:
  authelia:
    image: authelia/authelia:4
    container_name: atlas-access-e2e-authelia
    command:
      - authelia
      - --config=/config/configuration.yml
    volumes:
      - ./access/e2e/authelia.configuration.yml:/config/configuration.yml:ro
      - ./access/e2e/users_database.yml:/config/users_database.yml:ro
    expose:
      - "9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx-cerrada:
    image: nginx:alpine
    container_name: atlas-access-e2e-nginx
    volumes:
      - ./access/e2e/nginx-cerrada.conf:/etc/nginx/conf.d/default.conf:ro
      - ./access/e2e/fixture-cerrada:/var/atlas/data/store/cerrada:ro
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: atlas-access-e2e-caddy
    ports:
      - "18443:443"
    extra_hosts:
      - "atlas.e2e.local:host-gateway"
      - "auth.atlas.e2e.local:host-gateway"
    volumes:
      - ./access/e2e/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      authelia:
        condition: service_healthy
      nginx-cerrada:
        condition: service_started
