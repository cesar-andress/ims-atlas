server {
    listen 80;
    server_name _;
    root /var/atlas/data/store/cerrada;

    location = /datos-cerrados/whoami.json {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        return 404 '{"error":"use Caddy respond in e2e compose"}';
    }

    location /datos-cerrados/ {
        alias /var/atlas/data/store/cerrada/;
        autoindex on;
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}